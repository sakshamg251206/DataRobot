[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autods"
version = "2.0.0"
description = "Auto Data Science: upload a dataset and go from raw data to an explained, exportable model in one guided app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saksham Garg" }]
dependencies = [
    "streamlit>=1.45,<2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "plotly>=5.20",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "fpdf2>=2.7.8",
    "google-genai>=1.0",
]

[project.optional-dependencies]
# Gradient boosting and SHAP explanations. Installed by requirements.txt.
ml = ["xgboost>=2.0", "shap>=0.45"]
# Opt-in AI agent that executes generated pandas code (see README > Security).
agent = ["langchain-experimental>=0.3", "langchain-google-genai>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pandas-stubs>=2.2"]

[tool.setuptools.packages.find]
include = ["autods*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF001",  # allow typographic characters such as × and – in UI strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["autods"]

[tool.mypy]
python_version = "3.10"
packages = ["autods"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["autods"]
omit = ["autods/ui/*"]
